<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultar Empleado - Control de Vacaciones</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Detalle del Empleado</h2>
            <a href="{{ url_for('empleados') }}" class="btn-logout">Volver</a>
        </div>

        <div class="confirmar-box">
            <table>
                <tr>
                    <th>Cédula</th>
                    <td>{{ empleado[1] }}</td>
                </tr>
                <tr>
                    <th>Nombre</th>
                    <td>{{ empleado[2] }}</td>
                </tr>
                <tr>
                    <th>Puesto</th>
                    <td>{{ empleado[3] }}</td>
                </tr>
                <tr>
                    <th>Saldo Vacaciones</th>
                    <td>{{ empleado[4] }}</td>
                </tr>
                <tr>
                    <th>Fecha Contratación</th>
                    <td>{{ empleado[5] }}</td>
                </tr>
            </table>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
